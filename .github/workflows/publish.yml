name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Full history + tags so the release-notes step can diff against the previous tag.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - run: bun install
      - name: Install Lutin
        run: |
          brew tap halloweedev/lutin
          brew trust halloweedev/lutin
          brew install lutin
      - name: Bundle plugins
        run: bun run bundle:plugins
      - name: Verify bundled plugins
        run: |
          COUNT=$(find src-tauri/resources/bundled_plugins -maxdepth 2 -name plugin.json | wc -l | tr -d ' ')
          if [[ "$COUNT" -lt 1 ]]; then
            echo "No bundled plugins found under src-tauri/resources/bundled_plugins."
            exit 1
          fi

      # Write the repo-root .env that src-tauri/build.rs reads (`../.env`) so the
      # publishable KEYLIGHT_* client identifiers are compiled into the release.
      # Without this the free-tier launch beacon compiles to a no-op and the
      # Keylight dashboard shows 0 free-tier devices. SDK key is a masked secret;
      # tenant/product/pubkey are non-secret repo variables.
      - name: Write Keylight config
        env:
          KEYLIGHT_SDK_KEY: ${{ secrets.KEYLIGHT_SDK_KEY }}
        run: |
          cat > .env <<EOF
          KEYLIGHT_TENANT=${{ vars.KEYLIGHT_TENANT }}
          KEYLIGHT_PRODUCT=${{ vars.KEYLIGHT_PRODUCT }}
          KEYLIGHT_SDK_KEY=$KEYLIGHT_SDK_KEY
          KEYLIGHT_PUBKEY=${{ vars.KEYLIGHT_PUBKEY }}
          EOF
          echo "Wrote .env (tenant=${{ vars.KEYLIGHT_TENANT }} product=${{ vars.KEYLIGHT_PRODUCT }} sdk_key_set=${KEYLIGHT_SDK_KEY:+yes})"

      - name: Validate release tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing RELEASE_TAG (push a v* tag)."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)"
            exit 1
          fi

      - name: Validate app version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"

          TAURI_CONF_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          CARGO_VERSION=$(awk -F'"' '/^version =/ { print $2; exit }' ./src-tauri/Cargo.toml)
          PKG_VERSION=$(node -p 'require("./package.json").version')

          if [[ "$TAURI_CONF_VERSION" != "$TAG_VERSION" ]]; then
            echo "src-tauri/tauri.conf.json version ($TAURI_CONF_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "src-tauri/Cargo.toml version ($CARGO_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "package.json version ($PKG_VERSION) != tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # Release notes come from the curated CHANGELOG.md section for this exact tag, so every release
      # (stable or beta) shows the same grouped, human-written notes as the changelog rather than a raw
      # commit dump. If no matching "## <tag>" section exists, fall back to conventional-commit subjects
      # since the previous tag. Both matrix jobs compute the same notes and pass them as releaseBody
      # (idempotent), avoiding a post-publish edit race.
      - name: Generate release notes
        id: notes
        run: |
          # Exact-match the "## <tag>" heading (so v0.7.30 never picks up v0.7.30-beta.3), print until
          # the next "## v" heading, drop the heading itself, then trim leading blank lines.
          awk -v tag="## ${RELEASE_TAG}" '
            $0 == tag { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Using CHANGELOG.md section for ${RELEASE_TAG}."
          else
            echo "No CHANGELOG.md section for ${RELEASE_TAG}; falling back to commit-derived notes." >&2
            PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..$RELEASE_TAG"; else RANGE="$RELEASE_TAG"; fi

            subjects() { git log --no-merges --pretty=format:'%s' "$RANGE"; }
            FEATS=$(subjects | grep -E '^feat(\(.+\))?!?:' || true)
            FIXES=$(subjects | grep -E '^fix(\(.+\))?!?:' || true)
            CHORES=$(subjects | grep -vE '^(feat|fix)(\(.+\))?!?:' || true)

            {
              echo "## What's Changed"
              echo ""
              if [ -n "$FEATS" ]; then echo "### Features"; echo "$FEATS" | sed 's/^/- /'; echo ""; fi
              if [ -n "$FIXES" ]; then echo "### Fixes"; echo "$FIXES" | sed 's/^/- /'; echo ""; fi
              if [ -n "$CHORES" ]; then echo "### Chores"; echo "$CHORES" | sed 's/^/- /'; echo ""; fi
              if [ -n "$PREV_TAG" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${RELEASE_TAG}"
              fi
            } > release-notes.md
          fi

          cat release-notes.md
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # Any tag with a prerelease suffix (e.g. v0.7.26-beta.1) publishes as a GitHub
          # pre-release, so it never becomes "Latest" and the stable auto-updater
          # (releases/latest/download/latest.json) never serves it. Betas are install-by-hand.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles app

      - name: Configure Lutin for target
        run: |
          cp lutin.yml "$RUNNER_TEMP/lutin.yml"
          python3 - <<'PY'
          import os
          from pathlib import Path

          target = os.environ["TARGET"]
          arch = os.environ["ARCH"]
          workspace = os.environ["GITHUB_WORKSPACE"]
          config = Path(os.environ["RUNNER_TEMP"]) / "lutin.yml"
          text = config.read_text()
          text = text.replace(
              "path: ./src-tauri/target/release/bundle/macos/UsagePal.app",
              f"path: {workspace}/src-tauri/target/{target}/release/bundle/macos/UsagePal.app",
          )
          text = text.replace(
              "directory: ./src-tauri/target/release/bundle/lutin",
              f"directory: {workspace}/src-tauri/target/{target}/release/bundle/lutin",
          )
          text = text.replace(
              "dmgName: UsagePal-${version}.dmg",
              "dmgName: UsagePal-$" + "{version}-" + arch + ".dmg",
          )
          config.write_text(text)
          PY
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}

      - name: Build signed notarized DMG with Lutin
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          lutin notary setup \
            --profile lutin-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD"
          lutin release --config "$RUNNER_TEMP/lutin.yml" --verbose

      - name: Upload Lutin DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="src-tauri/target/${{ matrix.target }}/release/bundle/lutin/UsagePal-${RELEASE_TAG#v}-${{ matrix.arch }}.dmg"
          test -f "$DMG"
          gh release upload "$RELEASE_TAG" "$DMG" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify updater assets uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tr -d '\r')

          printf '%s\n' "$ASSETS" | grep -Fxq 'latest.json' || { echo "Missing updater manifest: latest.json"; exit 1; }
          printf '%s\n' "$ASSETS" | grep -Eq '\.sig$' || { echo "Missing updater signatures (.sig)"; exit 1; }
          printf '%s\n' "$ASSETS" | grep -Eq '^UsagePal-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?-${{ matrix.arch }}\.dmg$' || { echo "Missing Lutin DMG for ${{ matrix.arch }}"; exit 1; }

  # Single-writer repair for the updater manifests. The `publish` matrix uses
  # `tauri-action` in parallel, which claims to merge `latest.json` safely but
  # in practice races: both jobs fetch the old manifest before either uploads,
  # so the last writer clobbers the other's arch. 0.7.74-beta.1 shipped with
  # only darwin-x86_64 for exactly this reason (arm users saw no beta update).
  # This job runs once after both arch builds, heals a single-arch
  # `latest.json` if needed, and only then publishes the beta feed serially.
  repair-updater:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Heal latest.json if it lost an arch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair"
          for attempt in 1 2 3 4 5; do
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP/repair" --clobber; then
              break
            fi
            echo "latest.json not ready (attempt $attempt/5), retrying..." >&2
            sleep 3
          done
          test -f "$RUNNER_TEMP/repair/latest.json"
          cp "$RUNNER_TEMP/repair/latest.json" "$RUNNER_TEMP/repair/latest.json.orig"
          if python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "repair"
          data = json.loads((tmp / "latest.json").read_text())
          plats = set(data.get("platforms", {}).keys())
          need = {"darwin-aarch64", "darwin-x86_64"}
          missing = need - plats
          if not missing:
              print(f"latest.json OK: {sorted(plats)}")
              sys.exit(0)
          print(f"latest.json missing {sorted(missing)}, found {sorted(plats)} — healing...", file=sys.stderr)
          tag = os.environ["RELEASE_TAG"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          for arch in sorted(missing):
              art = "UsagePal_aarch64.app.tar.gz.sig" if "aarch64" in arch else "UsagePal_x64.app.tar.gz.sig"
              url_arch = "UsagePal_aarch64.app.tar.gz" if "aarch64" in arch else "UsagePal_x64.app.tar.gz"
              subprocess.run(["gh","release","download", tag, "--repo", os.environ["GITHUB_REPOSITORY"], "--pattern", art, "--dir", str(tmp), "--clobber"], check=True)
              sig = (tmp / art).read_text().strip()
              for key in [arch, f"{arch}-app"]:
                  data["platforms"][key] = {"signature": sig, "url": f"{base}/{url_arch}"}
          (tmp / "latest.json").write_text(json.dumps(data, indent=2) + "\n")
          print(f"healed latest.json now {sorted(data['platforms'].keys())}")
          # Signal that we healed by exiting 2
          sys.exit(2)
          PY
          then
            echo "latest.json already complete — no heal needed."
          else
            code=$?
            if [ $code -eq 2 ]; then
              echo "Healed latest.json — re-uploading..."
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/repair/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "latest.json healing failed (exit $code)" >&2
              exit $code
            fi
          fi
          cat "$RUNNER_TEMP/repair/latest.json" | python3 -m json.tool | head -n 60
          # Final guard: after healing, both arches must be present
          python3 - <<'PY'
          import json, os, pathlib, sys
          d=json.loads(pathlib.Path(f"{os.environ['RUNNER_TEMP']}/repair/latest.json").read_text())
          need={"darwin-aarch64","darwin-x86_64"}
          missing=need - set(d.get("platforms",{}))
          if missing:
              print(f"still missing {missing}", file=sys.stderr); sys.exit(1)
          PY

  beta-feed:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    needs: repair-updater
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Publish beta updater feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view beta-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create beta-feed \
              --repo "$GITHUB_REPOSITORY" \
              --title "Beta Feed" \
              --notes "Machine-readable updater feed for opt-in beta users." \
              --prerelease || \
              gh release view beta-feed --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          gh release view beta-feed \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == true) | "ok"' \
            | grep -Fxq ok || { echo "beta-feed release must be prerelease and not draft"; exit 1; }

          mkdir -p "$RUNNER_TEMP/beta-feed"

          # Latest.json is now guaranteed healed by the repair-updater job.
          for attempt in 1 2 3 4 5; do
            if gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern latest.json \
              --dir "$RUNNER_TEMP/beta-feed" \
              --clobber; then
              break
            fi
            echo "latest.json not ready (attempt $attempt/5), retrying..." >&2
            sleep 3
          done
          test -f "$RUNNER_TEMP/beta-feed/latest.json"

          # Guard against a single-arch feed (the 0.7.74-beta.1 bug): the feed
          # must contain both darwin arches or the updater on the missing arch
          # returns no update at all.
          python3 - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(f"{__import__('os').environ['RUNNER_TEMP']}/beta-feed/latest.json").read_text())
          plats = set(data.get("platforms", {}).keys())
          need = {"darwin-aarch64", "darwin-x86_64"}
          missing = need - plats
          if missing:
              print(f"beta feed latest.json missing platforms: {sorted(missing)}", file=sys.stderr)
              print(f"found: {sorted(plats)}", file=sys.stderr)
              sys.exit(1)
          PY

          cp "$RUNNER_TEMP/beta-feed/latest.json" "$RUNNER_TEMP/beta-feed/latest_beta.json"

          gh release upload beta-feed \
            "$RUNNER_TEMP/beta-feed/latest_beta.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release view beta-feed \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets \
            --jq '{isDraft,isPrerelease,assets:[.assets[].name]}'

          gh release view beta-feed \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | grep -Fxq latest_beta.json
